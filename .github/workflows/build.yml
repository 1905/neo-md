name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcrun swift --version

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Info.plist $version" >&2; exit 1; }
          [ -f "docs/releases/$GITHUB_REF_NAME.md" ] || { echo "missing docs/releases/$GITHUB_REF_NAME.md" >&2; exit 1; }

      - name: Test
        run: swift test

      - name: Bundle
        run: scripts/bundle.sh

      - name: DMG
        run: scripts/dmg.sh

      - name: Checksum
        run: shasum -a 256 build/neo-md-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: neo-md-dmg
          path: build/neo-md-*.dmg
          if-no-files-found: error

      - name: Update zip and feed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NEOMD_UPDATE_KEY: ${{ secrets.NEOMD_UPDATE_KEY }}
        run: |
          scripts/release-feed.sh
          cat build/latest.json

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/neo-md-$version.dmg" "build/neo-md-$version.zip" build/latest.json \
            --title "neo-md $version" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --verify-tag
