<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Small-size variant of AppIcon.svg for the 16 and 32 px slots: no "#" glyph, 2 thick lines per side. -->
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".35"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1c1d20" filter="url(#sh)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="412" height="824" fill="#1c1d20"/>
    <rect x="512" y="100" width="412" height="824" fill="#f6f6f4"/>
    <!-- raw side -->
    <rect x="176" y="352" width="266" height="96" rx="20" fill="#e8e8ea"/>
    <rect x="176" y="576" width="150" height="96" rx="48" fill="#8a8d94"/>
    <rect x="350" y="552" width="64" height="144" rx="8" fill="#5fbf62"/>
    <!-- render side -->
    <rect x="582" y="352" width="270" height="96" rx="20" fill="#1d1d1f"/>
    <rect x="582" y="576" width="210" height="96" rx="48" fill="#a8abb2"/>
    <rect x="504" y="100" width="16" height="824" fill="#000" fill-opacity=".3"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="4"/>
</svg>
